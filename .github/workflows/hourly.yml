name: HeatShift hourly pipeline
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hourly.yml'
      - 'automation/**'
permissions:
  contents: write
concurrency:
  group: heatshift-hourly
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install agent dependency
        run: python -m pip install pandas==2.2.3
      - name: Verify the single-command historical warehouse build
        if: github.event_name != 'schedule'
        run: make data PYTHON=python WORKDIR="${{ runner.temp }}/heatshift-warehouse"
      - name: Acquire, review, predict and cite
        id: pipeline
        continue-on-error: true
        run: python automation/hourly_pipeline.py --output automation/runs
      - name: Publish latest operational status outside frozen main
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python automation/publish_status.py
      - name: Retain raw, cleaned, processed and manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-evidence-${{ github.run_id }}
          path: automation/runs/
          retention-days: 30
          if-no-files-found: error
      - name: Surface upstream or pipeline failures
        if: steps.pipeline.outcome != 'success'
        run: exit 1
