name: Finalize audited submission tag
on:
  workflow_dispatch:
    inputs:
      final_sha:
        description: Complete reviewed main commit SHA
        required: true
        type: string
      previous_tag_sha:
        description: Current v1.0-final commit SHA, checked before moving
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: heatshift-final-release
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.final_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check report and required disclosure files
        run: |
          python -m pip install pypdf
          python -c "from pypdf import PdfReader; assert len(PdfReader('submission/Summary.pdf').pages)==1"
          test -s SUBMISSION_CHECKLIST.md
          test -s AI_Use_Log.md
          test -s evidence/final_audit/final_checklist.json
      - name: Move and verify only the named final tag, then update release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_SHA: ${{ inputs.final_sha }}
          PREVIOUS_TAG_SHA: ${{ inputs.previous_tag_sha }}
        run: python automation/finalize_release.py
